server:
  port: ${PORT:8080}
  error:
    include-message: always
  ssl:
    enabled: false
    enabled-protocols: TLSv1.2
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
  tomcat:
    accesslog:
      request-attributes-enabled: true

logging:
  level:
    root: INFO
    "[acm.internal.certification]": INFO

spring:
  docker:
    compose:
      enabled: false
  application:
    name: certification
  datasource:
    url: ${POSTGRESQL_DB_URL}
    username: ${POSTGRESQL_DB_USER}
    password: ${POSTGRESQL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_EMAIL:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  # empty defaults keep the application bootable when certificates are not
  # configured, the mass mail job reports the missing values when it runs
  gmail-api:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
    user-email: ${GMAIL_USER_EMAIL:}

jwt:
  secret: ${JWT_SECRET}
verify:
  base:
    frontend: ${VERIFY_BASE_FRONTEND:https://pecacm.in/}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:/tmp/acm-uploads}
